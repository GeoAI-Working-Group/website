name: build-and-deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"   # daily ~5am CT: rolls "upcoming" vs "past" forward
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install mkdocs-material pyyaml jsonschema yt-dlp
      - name: sync YouTube playlist -> data/talks/playlist.yml
        env: {YT_API_KEY: "${{ secrets.YT_API_KEY }}"}
        run: python scripts/sync_playlist.py || true
      - name: persist playlist snapshot (fallback if YouTube blocks a later run)
        run: |
          git config user.name "geoai-wg-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/talks/playlist.yml 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "talks: sync playlist [skip ci]" && git push) || true
      - run: python scripts/build_feeds.py --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
