# Community event submission (issue form) -> PR adding data/events/<file>.yml
name: event-from-issue
on:
  issues:
    types: [opened, edited]
permissions: {contents: write, pull-requests: write, issues: write}
jobs:
  pr:
    if: contains(github.event.issue.labels.*.name, 'event-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml jsonschema
      - id: conv
        env: {BODY: "${{ github.event.issue.body }}"}
        run: echo "path=$(printf '%s' "$BODY" | python scripts/issue_to_event.py)" >> "$GITHUB_OUTPUT"
      - run: python scripts/build_feeds.py   # validates schema
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: event/issue-${{ github.event.issue.number }}
          add-paths: ${{ steps.conv.outputs.path }}
          commit-message: "events: add from #${{ github.event.issue.number }}"
          title: "events: ${{ github.event.issue.title }}"
          body: "Closes #${{ github.event.issue.number }}. Verify dates on the official site before merging."
